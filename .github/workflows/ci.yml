name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: 900

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Disable native CPU flag for CI (portable build)
        run: rm -f .cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (burn-wgpu)
        run: cargo clippy --features burn-wgpu -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Cargo audit
        run: cargo audit

      - name: Install pip-audit and mypy
        run: pip install pip-audit mypy

      - name: pip-audit
        run: pip-audit --skip-editable || true

      - name: mypy (strict)
        run: mypy python/torchburn --ignore-missing-imports --no-implicit-optional || true

      - name: Check py.typed and version sync
        run: |
          test -f python/torchburn/py.typed || (echo "py.typed missing" && exit 1)
          python -c "import tomllib; p=open('pyproject.toml','rb'); d=tomllib.load(p); print(d['project']['version'])"
          cargo --version

  # ── Test Matrix ────────────────────────────────────────────────────
  # Optimized: 9 jobs in parallel (max 8) vs 19 before — 50% faster, Swatinem cache
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            feature: ""
          - os: ubuntu-latest
            python-version: "3.10"
            feature: ""
          - os: ubuntu-latest
            python-version: "3.12"
            feature: ""
          - os: windows-latest
            python-version: "3.11"
            feature: ""
          - os: macos-14
            python-version: "3.11"
            feature: ""
          - os: ubuntu-latest
            python-version: "3.11"
            feature: "burn"
          - os: windows-latest
            python-version: "3.11"
            feature: "burn"
          - os: ubuntu-latest
            python-version: "3.11"
            feature: "burn-wgpu"
          - os: windows-latest
            python-version: "3.11"
            feature: "burn-wgpu"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Disable native CPU flag for CI (portable build)
        shell: bash
        run: rm -f .cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.feature || 'default' }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-timeout numpy torch

      - name: Build and install extension
        shell: bash
        run: |
          if [ -n "${{ matrix.feature }}" ]; then
            maturin build --features "${{ matrix.feature }}" -r -o dist
          else
            maturin build -r -o dist
          fi
          pip install dist/*.whl --force-reinstall

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            # MacOS runners are slower and lack GPU; skip heavy BERT / benchmark tests that time out
            python -m pytest tests/ -x -q --timeout=300 -k "not TestBertTiny and not TestBenchmarkSuite"
          else
            python -m pytest tests/ -x -q --timeout=300
          fi
        env:
          TORCHBURN_ENGINE: ${{ matrix.feature || '' }}
          RUST_BACKTRACE: 1

  # ── Build Wheels (all platforms) ───────────────────────────────────
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Disable native CPU flag for CI (portable wheels)
        shell: bash
        run: rm -f .cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wheels-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTFLAGS="" CARGO_BUILD_RUSTFLAGS="" MATURIN_PEP517_ARGS="--features openblas"'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="11.0" RUSTFLAGS="" CARGO_BUILD_RUSTFLAGS="" MATURIN_PEP517_ARGS="--features openblas"'
          CIBW_ENVIRONMENT_WINDOWS: 'RUSTFLAGS="" CARGO_BUILD_RUSTFLAGS=""'
          CIBW_BEFORE_BUILD: "rm -f .cargo/config.toml"
          CIBW_TEST_REQUIRES: "pytest pytest-timeout numpy torch"
          CIBW_TEST_COMMAND: 'python -m pytest {project}/tests -x -q --timeout=300 -k "not TestBertTiny and not TestBenchmarkSuite"'
          CIBW_TEST_SKIP: "*-macosx_x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # ── Build sdist ────────────────────────────────────────────────────
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - run: maturin sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to TestPyPI (on PR) ───────────────────────────────────
  publish-testpypi:
    needs: [lint, test, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torchburn
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── Publish to PyPI (on tag) ──────────────────────────────────────
  publish-pypi:
    needs: [lint, test, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/torchburn
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

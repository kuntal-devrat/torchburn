name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: 900

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # NOTE (v0.6.1): `.cargo/config.toml` is now portable by design
      # (per-target x86-64-v2 / neoverse-n1 / apple-m1 baselines + runtime
      # dispatch), so it is kept for all CI jobs. Native-only builds use
      # `.cargo/config.native.toml` explicitly.

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (burn-wgpu)
        run: cargo clippy --features burn-wgpu -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2020-0040 || true

      - name: Install pip-audit and mypy
        run: pip install pip-audit mypy

      - name: pip-audit
        run: pip-audit --skip-editable || true

      - name: mypy (strict)
        run: mypy python/torchburn --ignore-missing-imports --no-implicit-optional || true

      - name: Check py.typed and version sync
        run: |
          test -f python/torchburn/py.typed || (echo "py.typed missing" && exit 1)
          python -c "import tomllib; p=open('pyproject.toml','rb'); d=tomllib.load(p); print(d['project']['version'])"
          cargo --version

  # ── Test Matrix ────────────────────────────────────────────────────
  # Optimized: 9 jobs in parallel (max 8) vs 19 before — 50% faster, Swatinem cache
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            feature: ""
          - os: ubuntu-latest
            python-version: "3.10"
            feature: ""
          - os: ubuntu-latest
            python-version: "3.12"
            feature: ""
          - os: windows-latest
            python-version: "3.11"
            feature: ""
          - os: macos-14
            python-version: "3.11"
            feature: ""
          - os: ubuntu-latest
            python-version: "3.11"
            feature: "burn"
          - os: windows-latest
            python-version: "3.11"
            feature: "burn"
          - os: ubuntu-latest
            python-version: "3.11"
            feature: "burn-wgpu"
          - os: windows-latest
            python-version: "3.11"
            feature: "burn-wgpu"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.feature || 'default' }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-timeout numpy torch

      - name: Build and install extension
        shell: bash
        run: |
          if [ -n "${{ matrix.feature }}" ]; then
            maturin build --features "${{ matrix.feature }}" -r -o dist
          else
            maturin build -r -o dist
          fi
          pip install dist/*.whl --force-reinstall

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            # MacOS runners are slower and lack GPU; skip heavy BERT / benchmark tests that time out
            python -m pytest tests/ -x -q --timeout=300 -k "not TestBertTiny and not TestBenchmarkSuite"
          else
            python -m pytest tests/ -x -q --timeout=300
          fi
        env:
          TORCHBURN_ENGINE: ${{ matrix.feature || 'native_cpu' }}
          RUST_BACKTRACE: 1

  # ── Build Wheels (all platforms) ───────────────────────────────────
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wheels-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU (for Linux aarch64 cross-building)
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          # NOTE: no RUSTFLAGS here — `.cargo/config.toml` already sets the
          # optimal portable baseline per target triple (x86-64-v2 /
          # neoverse-n1 / apple-m1). A global RUSTFLAGS would poison
          # cross-arch builds (e.g. apple-m1 breaks x86_64-apple-darwin with
          # "64-bit code requested on a subtarget that doesn't support it").
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" TORCHBURN_ENGINE="native_cpu"'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="11.0" TORCHBURN_ENGINE="native_cpu"'
          CIBW_ENVIRONMENT_WINDOWS: 'TORCHBURN_ENGINE="native_cpu"'
          CIBW_TEST_REQUIRES: "pytest pytest-timeout numpy torch"
          CIBW_TEST_COMMAND: 'python -m pytest {project}/tests -x -q --timeout=300 -k "not TestBertTiny and not TestBenchmarkSuite"'
          CIBW_TEST_SKIP: "*-macosx_x86_64 *linux_aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # ── CUDA feature gate build (compile-only, no runtime GPU needed) ──────────
  cuda-build:
    name: CUDA build (compile-check)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pip curl pkg-config libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cuda-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check --features cuda
        run: cargo check --features cuda
        env:
          CUDA_PATH: /usr/local/cuda
          PATH: /usr/local/cuda/bin:$PATH
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH

      - name: Install maturin
        run: pip3 install maturin

      - name: Build torchburn-cuda wheel (no runtime tests — no GPU in CI runner)
        run: |
          # torchburn-cuda is a second PyPI distribution built from this same
          # crate with the `cuda` feature. The [project] name is renamed so
          # maturin emits `torchburn_cuda-*.whl` metadata; the module name
          # (torchburn._torchburn) is unchanged, so `import torchburn` works.
          sed -i 's/^name = "torchburn"$/name = "torchburn-cuda"/' pyproject.toml
          maturin build --features cuda -r -o dist-cuda
        env:
          CUDA_PATH: /usr/local/cuda
          PATH: /usr/local/cuda/bin:$PATH
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH

      # Artifact is named outside the `wheels-*` glob so publish-pypi /
      # publish-testpypi can never accidentally upload it to the torchburn
      # project. The release-assets job picks it up explicitly.
      - uses: actions/upload-artifact@v4
        with:
          name: torchburn-cuda
          path: dist-cuda/*.whl

      # Second PyPI distribution, tag-gated like publish-pypi: PR/main runs
      # only produce the artifact. NVIDIA users get `pip install torchburn-cuda`.
      - name: Publish torchburn-cuda to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cuda
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ── Native wheel variant (peak local performance) ──────────────────
  # Portable wheels above use `.cargo/config.toml` per-target baselines
  # (x86-64-v2 / neoverse-n1 / apple-m1) + runtime dispatch. This job builds
  # with `.cargo/config.native.toml` (`target-cpu=native`, fat LTO,
  # codegen-units=1) so the self-hosted bench runner gets the fastest
  # possible wheel. Uploaded as a `wheels-native` artifact; `release-assets`
  # attaches it to the GitHub Release when this is dispatched on a tag.
  build-native:
    runs-on: [self-hosted, bench]
    continue-on-error: true
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      # NOTE: native ISA build via RUSTFLAGS overlay (never for PyPI)
      - name: Build native wheel
        run: maturin build -r -o dist-native
        env:
          RUSTFLAGS: "-C target-cpu=native -C codegen-units=1"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-native
          path: dist-native/*.whl

  # ── Build sdist ────────────────────────────────────────────────────
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - run: maturin sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to TestPyPI (on PR) ───────────────────────────────────
  publish-testpypi:
    needs: [lint, test, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torchburn
    steps:
      # Portable wheels only — never the torchburn-cuda or native variants.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-ubuntu-latest
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-windows-latest
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-macos-14
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── Publish to PyPI (on tag) ──────────────────────────────────────
  publish-pypi:
    needs: [lint, test, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/torchburn
    steps:
      # Portable wheels only — never the torchburn-cuda or native variants.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-ubuntu-latest
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-windows-latest
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-macos-14
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ── GitHub Release assets (llama.cpp-style) ───────────────────────
  # The portable wheels + sdist go to PyPI; the exotic variants — the
  # torchburn-cuda per-backend wheel and the `wheels-native` peak-ISA wheel —
  # are attached to the GitHub Release instead, so users can grab them
  # without touching the package index.
  release-assets:
    needs: [build-wheels, build-sdist, cuda-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: torchburn-cuda
          path: dist
      # Native bench wheel exists only when build-native ran (self-hosted
      # bench runner, manual dispatch). Attach it best-effort when present.
      - uses: actions/download-artifact@v4
        with:
          name: wheels-native
          path: dist
          fail-on-error: false
      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
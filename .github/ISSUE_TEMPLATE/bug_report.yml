name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Please provide a minimal, standalone Python script or commands to reproduce the issue.
      placeholder: |
        import torch
        import torchburn as tb

        model = tb.LLM.from_pretrained("Qwen/Qwen2.5-0.5B-Instruct", quant="int4")
        # Reproduce issue here
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Stack Trace / Error Logs
      description: Paste the complete traceback or terminal logs here.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: System Environment
      description: System information (OS, CPU, GPU, Python, PyTorch, TorchBurn version).
      placeholder: |
        - OS: Ubuntu 22.04 LTS / macOS 14 Sonoma / Windows 11
        - CPU: Intel Core i7-12700H / AMD Ryzen 9 7950X / Apple M2
        - GPU: Integrated Intel Iris Xe / None / Apple GPU
        - Python version: 3.12.3
        - PyTorch version: 2.5.0
        - TorchBurn version: 1.0.0
    validations:
      required: true

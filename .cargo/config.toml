# Portable defaults: every PyPI wheel / CI build uses a portable baseline ISA.
# Runtime dispatch in src/dispatch.rs upgrades to AVX2/AVX-512-VNNI/NEON via
# #[target_feature] kernels, so portable != slow. Do NOT set target-cpu=native
# here — native builds use .cargo/config.native.toml explicitly:
#   RUSTFLAGS="--config .cargo/config.native.toml" cargo bench --profile native
#   (or: cp .cargo/config.native.toml overlay and build with --config flag)
#
# Per-target baselines:
#   x86-64-v2  (SSE4.2+SSSE3+POPCNT, everything since ~2009) — portable Windows/Linux/macOS
#   neoverse-n1 (ARMv8.2+dotprod, Graviton2+/Ampere)          — portable aarch64 Linux
#   apple-m1    (ARMv8.4, Apple Silicon macOS)                — portable macOS arm64
#   apple-a14   (ARMv8.4, iPhone 12+)                         — iOS baseline
[build]
rustflags = ["-C", "overflow-checks=off", "-C", "debug-assertions=off"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "link-arg=-Wl,-z,relro,-z,now"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=neoverse-n1"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

[target.aarch64-apple-ios]
rustflags = ["-C", "target-cpu=apple-a14"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "target-cpu=apple-a14"]

[target.x86_64-apple-ios]
rustflags = ["-C", "target-cpu=x86-64-v2"]

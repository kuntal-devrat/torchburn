[package]
name = "torchburn"
version = "0.6.1"
edition = "2021"
description = "Hardware-agnostic PyTorch compilation backend: PyO3 + DLPack zero-copy FFI bridge to a Rust execution engine with BLAKE3 structural graph caching"
license = "Apache-2.0"
keywords = ["pytorch", "dlpack", "burn", "compile", "ffi"]
categories = ["api-bindings", "compilers"]
repository = "https://github.com/kuntal-devrat/torchburn"
homepage = "https://github.com/kuntal-devrat/torchburn"

[lib]
name = "_torchburn"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py39", "multiple-pymethods"] }
blake3 = "1.5"
rayon = "1.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wide = "0.7"
libm = "0.2"
smallvec = "1"
half = { version = "2", features = ["num-traits"] }
ahash = "0.8"
crossbeam-utils = "0.8"

# Optional Burn execution engine (Phase 2/3). Compile with:
#   maturin develop --features burn          # ndarray CPU backend
#   maturin develop --features burn-wgpu     # GPU (Metal/Vulkan/DX12) + ndarray CPU fallback
# The default build is the zero-copy native CPU engine.
burn = { version = "0.18", optional = true, default-features = false, features = ["ndarray", "std"] }
matrixmultiply = { version = "0.3.11", optional = true }
wgpu = { version = "25.0", optional = true }
openblas-src = { version = "0.10", optional = true, features = ["cblas", "static"] }

# CUDA backend (NVIDIA GPUs via cudarc + cuBLAS/cuBLASLt).
cudarc = { version = "0.13", optional = true, features = ["std", "f16", "cuda-version-from-build-system"] }

# Metal native backend (Apple Silicon unified memory, bypasses WGPU).
# Enabled on macOS + iOS (shared unified-memory architecture).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = { version = "0.29", optional = true }

[features]
default = ["extension-module", "matrixmultiply", "burn-wgpu"]
extension-module = ["pyo3/extension-module"]
dispatch-test = []
burn = ["dep:burn"]
burn-wgpu = ["dep:burn", "burn/wgpu", "dep:wgpu"]
openblas = ["dep:openblas-src"]
# CUDA backend for NVIDIA GPUs. Requires CUDA toolkit installed.
cuda = ["dep:cudarc"]
# Metal native backend for Apple Silicon (bypasses WGPU for unified memory).
metal-native = ["dep:metal"]
# Meta-feature: enable every GPU path available on the host
# (WGPU universal + CUDA where supported + Metal where supported).
# CUDA/Metal deps are target-gated so this stays portable.
all-gpu = ["burn-wgpu", "cuda", "metal-native"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = 0
split-debuginfo = "off"
overflow-checks = false
debug-assertions = false
incremental = false

# Fast CI / `cargo test --release`: thin LTO + parallel codegen.
# Inherits everything else from release.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# Local bench / native wheel: identical to release, but built with
# RUSTFLAGS="-C target-cpu=native" (see .cargo/config.native.toml).
# Never use for portable PyPI wheels.
[profile.native]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = 1

[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "off"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_gemm"
harness = false

[[bench]]
name = "bench_int4_gemv"
harness = false

[[bench]]
name = "bench_decoder_step"
harness = false

[[bench]]
name = "bench_wgpu_submit"
harness = false


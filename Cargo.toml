[package]
name = "torchburn"
version = "0.5.5"
edition = "2021"
description = "Hardware-agnostic PyTorch compilation backend: PyO3 + DLPack zero-copy FFI bridge to a Rust execution engine with BLAKE3 structural graph caching"
license = "Apache-2.0"
keywords = ["pytorch", "dlpack", "burn", "compile", "ffi"]
categories = ["api-bindings", "compilers"]
repository = "https://github.com/kuntal-devrat/torchburn"
homepage = "https://github.com/kuntal-devrat/torchburn"

[lib]
name = "_torchburn"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py39", "multiple-pymethods"] }
blake3 = "1.5"
rayon = "1.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Portable SIMD (SSE2/AVX2 on x86-64, NEON on ARM, wasm) for the attention
# kernels — zero-copy lane math for the QK^T dots and softmax exp.
wide = "0.7"
libm = "0.2"
smallvec = "1"

# Optional Burn execution engine (Phase 2/3). Compile with:
#   maturin develop --features burn          # ndarray CPU backend
#   maturin develop --features burn-wgpu     # GPU (Metal/Vulkan/DX12) + ndarray CPU fallback
# The default build is the zero-copy native CPU engine.
burn = { version = "0.18", optional = true, default-features = false, features = ["ndarray", "std"] }
matrixmultiply = { version = "0.3.11", optional = true }
wgpu = { version = "25.0", optional = true }
openblas-src = { version = "0.10", optional = true, features = ["cblas", "static"] }

[features]
default = ["extension-module", "matrixmultiply", "burn-wgpu"]
# Enable the pyo3 `extension-module` link mode (no libpython dependency).
# Off by default when building benches/tests so criterion and parity test
# binaries can link against the crate without the Python extension ABI.
extension-module = ["pyo3/extension-module"]
# Tests-only: force each CPU feature tier (see src/dispatch.rs) and assert
# output parity + monotonic performance across tiers.
dispatch-test = []
burn = ["dep:burn"]
# wgpu backend on top of the burn engine.  metal/vulkan are the graphics
# APIs wgpu targets (AutoGraphicsApi picks Metal on macOS, Vulkan elsewhere;
# DX12 is available through the same wgpu stack on Windows).
burn-wgpu = ["dep:burn", "burn/wgpu", "dep:wgpu"]
# Link OpenBLAS for MKL-level matmul performance.
# Downloads and builds from source via the openblas-src crate.
# Use: maturin develop --features openblas  (or set TORCHBURN_MATMUL=openblas)
# Skylake kernels give 3-4× over matrixmultiply sgemm for 1024³.
openblas = ["dep:openblas-src"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_gemm"
harness = false

[[bench]]
name = "bench_int4_gemv"
harness = false

[[bench]]
name = "bench_decoder_step"
harness = false

[[bench]]
name = "bench_wgpu_submit"
harness = false

